<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="Skizze: vier Zahlengeraden untereinander, jede zoomt in die vorige: 1 bis 2, 1,4 bis 1,5, 1,41 bis 1,42, 1,414 bis 1,415; die Stelle der Wurzel aus 2 ist markiert">
<g font-size="13" stroke="#111"><line x1="40" y1="40" x2="520" y2="40"/><line x1="40" y1="100" x2="520" y2="100"/><line x1="40" y1="160" x2="520" y2="160"/><line x1="40" y1="220" x2="520" y2="220"/></g>
<g font-size="13"><text x="30" y="30">1</text><text x="515" y="30">2</text><text x="25" y="90">1,4</text><text x="505" y="90">1,5</text><text x="20" y="150">1,41</text><text x="500" y="150">1,42</text><text x="15" y="210">1,414</text><text x="495" y="210">1,415</text></g>
<g fill="#b91c1c"><circle cx="255" cy="40" r="5"/><circle cx="270" cy="100" r="5"/><circle cx="290" cy="160" r="5"/><circle cx="300" cy="220" r="5"/></g>
<text x="280" y="250" text-anchor="middle" font-size="13">Regler „Stufe“ 0 bis 3 zoomt; unten: √2 liegt zwischen den Grenzen, Quadrate der Grenzen stehen darunter</text>
</svg>
