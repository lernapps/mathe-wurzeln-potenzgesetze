# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Rationale, irrationale und reelle Zahlen
description:
  Zahlen unterscheiden, die sich als Bruch schreiben lassen, und solche, bei denen das nicht geht, und alle zusammen
  als reelle Zahlen einordnen.
competencies:
  - reelle-zahlen
blocks:
  - type: section
    id: einstieg
    title: Erste Aufgabe
    blocks:
      - type: text
        text:
          Auf der Lupe hast du gesehen, dass die Stellen von √2 nie aufhören. Am Ende dieser Seite weißt du, welche Zahlen
          sich als Bruch schreiben lassen und welche nicht, und wie die Zahlengerade am Ende keine Lücken mehr hat.
      - type: multiple-choice
        id: bruch-erkennen
        text: Welche dieser Zahlen lassen sich als Bruch zweier ganzer Zahlen schreiben?
        options:
          - text: 0,6
            correct: true
            info: 0,6 = $\frac{3}{5}$.
          - text: 0,333… (die Dreien hören nie auf)
            correct: true
            info: 0,333… = $\frac{1}{3}$. Die Ziffer 3 wiederholt sich immer gleich.
          - text: 1,41421356… (√2, die Stellen hören nie auf)
            correct: false
            info: Die Stellen von √2 wiederholen sich nicht in einem Muster. √2 ist kein Bruch.
          - text: 0,25
            correct: true
            info: 0,25 = $\frac{1}{4}$.
        explanation: Eine Dezimalzahl ist ein Bruch, wenn ihre Stellen aufhören oder sich immer gleich wiederholen.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
  - type: section
    id: idee
    title: Rational oder nicht?
    blocks:
      - type: text
        text:
          'Brüche haben immer eine Dezimalzahl, die abbricht oder sich wiederholt: $\frac{1}{4} = 0{,}25$, $\frac{1}{3}$ =
          0,333…, $\frac{1}{7}$ = 0,142857142857… Bei √2 passiert das nicht: Die Stellen laufen unendlich weiter und bilden kein
          Muster.'
      - type: definition
        term: rationale Zahl
        explanation:
          Eine rationale Zahl lässt sich als Bruch $\frac{p}{q}$ mit ganzen Zahlen $p$ und $q \neq 0$ schreiben. Ihre
          Dezimalzahl bricht ab oder wiederholt sich.
      - type: definition
        term: irrationale Zahl
        explanation:
          Eine irrationale Zahl lässt sich nicht als Bruch schreiben. Ihre Dezimalzahl hat unendlich viele Stellen
          ohne Wiederholung, zum Beispiel √2, √3 und π.
      - type: definition
        term: reelle Zahl
        explanation:
          Reelle Zahlen sind alle rationalen und alle irrationalen Zahlen zusammen. Jeder Punkt der Zahlengerade gehört
          zu genau einer reellen Zahl.
  - type: section
    id: regel
    title: Die Zahlenmengen und die Zahlengerade
    blocks:
      - type: figure
        image: images/zahlengerade-reell.svg
        alt:
          Eine Zahlengerade von minus 2 bis 4. Die Zahlen minus 0,5 und 0,75 sind gefüllte Punkte, die Zahlen Wurzel aus 2
          und Pi sind offene Punkte mit rotem Rand.
        caption: Gefüllte Punkte sind rational, offene sind irrational. Beide liegen auf derselben Zahlengerade.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Die Zahlenmengen
        header:
          - Menge
          - Zeichen
          - Beispiele
        rows:
          - - natürliche Zahlen
            - ℕ
            - 0, 1, 2, 3, …
          - - ganze Zahlen
            - ℤ
            - …, −2, −1, 0, 1, …
          - - rationale Zahlen
            - ℚ
            - −0,5; 0,75; $\frac{1}{3}$
          - - reelle Zahlen
            - ℝ
            - alle rationalen Zahlen und dazu √2, π und alle anderen irrationalen
      - type: text
        text:
          "Jede Menge steckt in der nächsten: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Mit den reellen Zahlen hat die Zahlengerade keine Lücken mehr:
          In diesem Kurs wachsen die Zahlen damit ein letztes Mal. Für Wurzeln aus natürlichen Zahlen gilt: √a ist rational genau
          dann, wenn a eine Quadratzahl ist."
      - type: note
        title: "Denkweg: Warum √2 kein Bruch ist"
        blocks:
          - type: text
            text:
              'Angenommen, $\sqrt{2} = \frac{p}{q}$ mit einem gekürzten Bruch. Quadrieren gibt $p^2 = 2q^2$, also ist $p^2$
              gerade. Das Quadrat einer ungeraden Zahl ist ungerade, also ist $p$ gerade: $p = 2k$. Dann ist $4k^2 = 2q^2$, also
              $q^2 = 2k^2$, und $q$ ist auch gerade. Beide wären durch 2 teilbar, das widerspricht dem Kürzen. Also gibt es keinen
              solchen Bruch.'
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: √12 oder √49?
        blocks:
          - type: text
            text:
              12 ist keine Quadratzahl (3² = 9, 4² = 16), also ist $\sqrt{12}$ irrational. 49 ist eine Quadratzahl, $\sqrt{49}
              = 7$, also ist $\sqrt{49}$ rational, sogar eine natürliche Zahl.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: irrational-welche
        text: Welche dieser Zahlen ist irrational?
        options:
          - text: √49
            correct: false
            info: √49 = 7. Das ist eine natürliche Zahl.
          - text: 0,121212… (die Ziffern 12 wiederholen sich)
            correct: false
            info: 'Die Ziffern wiederholen sich: Das ist ein Bruch, nämlich $\frac{4}{33}$.'
          - text: √12
            correct: true
            info: 12 ist keine Quadratzahl. Also ist √12 irrational.
          - text: 1,75
            correct: false
            info: 1,75 = $\frac{7}{4}$.
        explanation: Eine Wurzel aus einer natürlichen Zahl ist irrational, wenn die Zahl unter der Wurzel keine Quadratzahl ist.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
      - type: number
        id: zaehle-rationale
        text: Wie viele der Zahlen √4, √5, √9, √16, √20, √25 sind rational?
        answer: 4
        tolerance: 0
        mistakes:
          - answer: 2
            message: Das sind die irrationalen. Gefragt sind die rationalen Zahlen.
        hint: Welche Radikanden sind Quadratzahlen?
        explanation: √4 = 2, √9 = 3, √16 = 4 und √25 = 5 sind natürliche Zahlen. √5 und √20 sind irrational.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
      - type: matching
        id: kleinste-menge
        text: Ordne jeder Zahl die kleinste Zahlenmenge zu, in der sie liegt.
        pairs:
          - left: die Zahl 5
            right: ℕ (natürliche Zahlen)
          - left: die Zahl −4
            right: ℤ (ganze Zahlen)
          - left: die Zahl 0,75
            right: ℚ (rationale Zahlen)
          - left: die Zahl √3
            right: ℝ (reelle Zahlen)
        explanation: "Jede Zahl liegt in einer kleinsten Menge: 5 in ℕ, −4 in ℤ, 0,75 in ℚ und √3 nur in ℝ."
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
      - type: true-false
        id: periodisch-irrational
        text: Die Zahl 0,1010010001… (nach jeder 1 eine Null mehr) ist irrational.
        answer: true
        explanation: Die Nullen werden immer mehr, es gibt keine Wiederholung. So eine Zahl ist kein Bruch.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
      - type: ordering
        id: zahlen-ordnen
        text: Ordne die Zahlen von klein nach groß.
        items:
          - 1,4
          - 1,41
          - √2
          - 1,5
        explanation: √2 ≈ 1,41421. Das ist größer als 1,41 und kleiner als 1,5.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
      - type: single-choice
        id: feld-18
        text: Ein quadratisches Feld hat 18 m². Ist seine Seitenlänge eine rationale Zahl?
        options:
          - text: Nein, denn 18 ist keine Quadratzahl, also ist √18 irrational.
            correct: true
            info: "4² = 16 und 5² = 25: Zwischen beiden liegt 18, aber keine Quadratzahl ist 18."
          - text: Ja, denn die Seitenlänge ist 4,5 m.
            correct: false
            info: 4,5² = 20,25, nicht 18.
          - text: Ja, denn jede Länge lässt sich messen.
            correct: false
            info: Messen liefert einen Näherungswert. Die genaue Seite ist trotzdem irrational.
          - text: Nein, denn 18 ist keine natürliche Zahl.
            correct: false
            info: 18 ist eine natürliche Zahl. Es kommt darauf an, ob sie eine Quadratzahl ist.
        explanation: √a ist für natürliche a nur dann rational, wenn a eine Quadratzahl ist.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/reelle-zahlen/
