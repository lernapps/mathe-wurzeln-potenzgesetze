# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Wurzelterme vereinfachen
description: Aus einer Wurzel einen Faktor herausziehen und gleichartige Wurzeln zusammenfassen.
competencies:
  - wurzelgesetze
blocks:
  - type: section
    id: einstieg
    title: Erste Aufgabe
    blocks:
      - type: text
        text:
          Das Pflaster im Schulgarten ist quadratisch und hat 50 m². Die Seite ist √50. Am Ende dieser Seite kannst du so
          einen Term in eine einfache Form bringen und mit Wurzeln addieren.
      - type: single-choice
        id: faktor-50
        text: Es gilt √50 = √(25 · 2). Welche Zahl lässt sich aus der Wurzel herausziehen?
        options:
          - text: "5"
            correct: true
            info: √25 = 5, und das Produktgesetz gibt √(25 · 2) = √25 · √2 = 5 · √2.
          - text: "25"
            correct: false
            info: 25 ist der Radikand. Herausgezogen wird seine Wurzel.
          - text: "2"
            correct: false
            info: "2 bleibt unter der Wurzel: Es ist keine Quadratzahl."
          - text: "50"
            correct: false
            info: 50 ist die ganze Zahl unter der Wurzel.
        explanation: √(25 · 2) = √25 · √2 = 5 · √2.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/wurzelgesetze/
  - type: section
    id: idee
    title: Quadratfaktor herausziehen
    blocks:
      - type: text
        text:
          "Du suchst unter der Wurzel einen Faktor, der eine Quadratzahl ist: 4, 9, 16, 25, 36, …. Mit dem Produktgesetz ziehst
          du seine Wurzel vor die Wurzel."
      - type: table
        caption: So vereinfachst du $\sqrt{72}$
        header:
          - Schritt
          - Rechnung
        rows:
          - - Quadratfaktor suchen
            - $72 = 36 \cdot 2$
          - - Produktgesetz
            - $\sqrt{72} = \sqrt{36} \cdot \sqrt{2}$
          - - Wurzel ziehen
            - $= 6 \cdot \sqrt{2}$
      - type: text
        text:
          Schreibe $6 \cdot \sqrt{2}$ kurz als $6\sqrt{2}$. Unter der Wurzel soll am Ende keine Quadratzahl als Faktor mehr
          stecken.
  - type: section
    id: regel
    title: Gleichartige Wurzeln
    blocks:
      - type: definition
        term: gleichartige Wurzeln
        explanation:
          Gleichartige Wurzeln haben denselben Radikanden, zum Beispiel $3\sqrt{2}$ und $5\sqrt{2}$. Du addierst die
          Faktoren vor der Wurzel.
      - type: formula
        formula: 3\sqrt{2} + 5\sqrt{2} = 8\sqrt{2}
      - type: text
        text:
          'Das ist wie bei 3 Äpfeln plus 5 Äpfeln: Die Einheit √2 bleibt. Ungleichartige Wurzeln wie $\sqrt{2} + \sqrt{3}$
          lassen sich nicht zusammenfassen.'
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: √12 + √27
        blocks:
          - type: text
            text:
              'Erst vereinfachen: $\sqrt{12} = \sqrt{4 \cdot 3} = 2\sqrt{3}$ und $\sqrt{27} = \sqrt{9 \cdot 3} = 3\sqrt{3}$.
              Dann zusammenfassen:'
          - type: formula
            formula: \sqrt{12} + \sqrt{27} = 2\sqrt{3} + 3\sqrt{3} = 5\sqrt{3}
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: faktor-ziehen
        given:
          e:
            pick: 1
            from:
              data: quadratfaktoren
        task:
          text: Schreibe √{{e.n}} in der Form a · √b, so dass b keine Quadratzahl als Faktor mehr hat. Wie groß ist a?
        answer:
          value: e.a
          compare:
            number:
              format: integer
        mistakes:
          - value: e.a * e.a
            message: Du hast den Quadratfaktor selbst vor die Wurzel gezogen. Vor die Wurzel kommt seine Wurzel.
          - value: e.b
            message: Das ist die Zahl, die unter der Wurzel bleibt. Gefragt ist der Faktor vor der Wurzel.
        hint: "Suche die größte Quadratzahl, die in {{e.n}} steckt: 4, 9, 16, 25, 36, 49, 100."
        steps:
          - Zerlege {{e.n}} in einen Quadratfaktor und einen Rest.
          - Die Wurzel des Quadratfaktors ist {{answer}}.
      - type: generated
        id: gleichartig-addieren
        given:
          p:
            int:
              - 2
              - 9
          q:
            int:
              - 2
              - 9
          b:
            oneOf:
              - 2
              - 3
              - 5
              - 6
              - 7
        where:
          - p * q != p + q
        task:
          text: "Fasse zusammen: {{p}}·√{{b}} + {{q}}·√{{b}} = r · √{{b}}. Wie groß ist r?"
        answer:
          value: p + q
          compare:
            number:
              format: integer
        mistakes:
          - value: p * q
            message: Du hast die Faktoren multipliziert. Beim Addieren gleichartiger Wurzeln addierst du die Faktoren vor der Wurzel.
          - value: p + q + b
            message: Der Radikand {{b}} bleibt unter der Wurzel. Er wird nicht addiert.
        hint: Denke an {{p}} Äpfel plus {{q}} Äpfel. Die Einheit √{{b}} bleibt.
        steps:
          - "{{p}}·√{{b}} + {{q}}·√{{b}} = ({{p}} + {{q}}) · √{{b}}"
          - Also r = {{answer}}.
      - type: matching
        id: term-vereinfacht
        text: Ordne jedem Term seine einfache Form zu.
        pairs:
          - left: die Wurzel √20
            right: 2√5
          - left: die Wurzel √45
            right: 3√5
          - left: die Wurzel √75
            right: 5√3
          - left: die Wurzel √98
            right: 7√2
        distractors:
          - 4√5
          - 2√10
        explanation: √20 = √(4·5), √45 = √(9·5), √75 = √(25·3), √98 = √(49·2).
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/wurzelgesetze/
      - type: single-choice
        id: acht-achtzehn
        text: Was ist √8 + √18 in einfacher Form?
        options:
          - text: 5√2
            correct: true
            info: √8 = 2√2 und √18 = 3√2. Zusammen 5√2.
          - text: √26
            correct: false
            info: Du hast unter der Wurzel addiert. Für Plus gibt es kein Wurzelgesetz.
          - text: 5√10
            correct: false
            info: Vereinfache erst jede Wurzel, dann addiere die Faktoren.
          - text: √8 + √18
            correct: false
            info: "Das lässt sich noch vereinfachen: beide Wurzeln sind gleichartig."
        explanation: "Erst vereinfachen: √8 = √(4·2) = 2√2 und √18 = √(9·2) = 3√2, dann zusammenfassen."
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/wurzelgesetze/
      - type: single-choice
        id: pflaster-72
        text: Ein quadratisches Pflaster hat 72 m². Wie lang ist seine Seite genau?
        options:
          - text: 6√2 m
            correct: true
            info: √72 = √(36 · 2) = 6√2.
          - text: 36√2 m
            correct: false
            info: Du hast den Quadratfaktor 36 selbst herausgezogen. Herausgezogen wird seine Wurzel, 6.
          - text: 2√6 m
            correct: false
            info: 2√6 ist ungefähr 4,9. Das Quadrat davon ist 24.
          - text: 8,5 m
            correct: false
            info: 8,5² = 72,25. Das ist ein Näherungswert, aber nicht die genaue Seite.
        explanation: Die genaue Seite ist √72 = 6√2. Als Näherungswert sind das etwa 8,49 m.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/wurzelgesetze/
