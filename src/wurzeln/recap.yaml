# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für Wurzeln und reelle Zahlen
description: Vier Bausteine aus früheren Jahren, die du für Wurzeln und reelle Zahlen brauchst, mit Kurztests zum Prüfen.
recap:
  - mathematik/potenzen
  - mathematik/zahlen-vergleichen-ordnen
  - mathematik/dezimalbrueche-rechnen
  - mathematik/rationale-zahlen-rechnen
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text:
          "Für Wurzeln und reelle Zahlen brauchst du vier Dinge aus früheren Jahren: Potenzen, Zahlen ordnen, Dezimalbrüche
          und negative Zahlen. Lies jeden Abschnitt kurz und beantworte die Kurztests. Sie zählen nichts und speichern nichts,
          sie zeigen dir nur, ob du es kannst. Unter jedem Abschnitt steht, was du wiederholen kannst, wenn du unsicher warst.
          Hast du alle Kurztests richtig, bist du bereit."
  - type: section
    id: potenzen
    title: Potenzen und Zehnerpotenzen
    blocks:
      - type: definition
        term: Potenz
        explanation: 'Eine Potenz schreibt ein Produkt aus gleichen Faktoren kurz auf: $2^3 = 2 \cdot 2 \cdot 2 = 8$.'
      - type: definition
        term: Basis
        explanation: Die Basis ist der Faktor, der wiederholt wird. In $2^3$ ist 2 die Basis.
      - type: definition
        term: Exponent
        explanation: Der Exponent sagt, wie oft die Basis als Faktor steht. In $2^3$ ist 3 der Exponent.
      - type: definition
        term: Quadratzahl
        explanation:
          Eine Quadratzahl ist das Quadrat einer natürlichen Zahl, zum Beispiel $7^2 = 49$. Die ersten Quadratzahlen
          sind 1, 4, 9, 16, 25, 36, 49, 64, 81 und 100. Später brauchst du auch 121, 144, 169, 196, 225, 256 und 400.
      - type: definition
        term: Zehnerpotenz
        explanation:
          Eine Zehnerpotenz hat die Basis 10, zum Beispiel $10^3 = 10 \cdot 10 \cdot 10 = 1000$. Der Exponent zählt
          die Nullen.
      - type: example
        title: Eine große Zahl kurz geschrieben
        blocks:
          - type: text
            text:
              Die Erde ist rund $15 \cdot 10^7$ Kilometer von der Sonne entfernt. $10^7$ ist eine 1 mit sieben Nullen, also
              10 000 000. Das Ergebnis ist 150 000 000 Kilometer.
      - type: vue-component
        id: test-potenz
        component: Kurztest
        props:
          question: Was ist 2⁴ + 3³?
          options:
            - text: "125"
              correct: false
              info: Das wäre (2 + 3)³. Hier wird jede Potenz für sich berechnet und dann addiert.
            - text: "43"
              correct: true
              info: 2⁴ = 16 und 3³ = 27, zusammen 43.
            - text: "17"
              correct: false
              info: Du hast 2 · 4 = 8 und 3 · 3 = 9 gerechnet. Der Exponent sagt, wie oft die Basis als Faktor steht.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 2 hoch 4 plus 3 hoch 3? Zur Wahl stehen 43, 17 und 125. Richtig ist 43, denn 2 hoch 4 ist 16
          und 3 hoch 3 ist 27."
      - type: vue-component
        id: test-quadratzahl
        component: Kurztest
        props:
          question: Was ist 15² − 14²?
          options:
            - text: "210"
              correct: false
              info: Das ist 15 · 14. Gefragt ist die Differenz der Quadrate.
            - text: "29"
              correct: true
              info: 15² = 225 und 14² = 196, 225 − 196 = 29.
            - text: "1"
              correct: false
              info: Das wäre (15 − 14)². Hier werden erst die Quadrate gebildet und dann abgezogen.
            - text: "421"
              correct: false
              info: Das ist 225 + 196. Hier wird abgezogen.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 15 zum Quadrat minus 14 zum Quadrat? Zur Wahl stehen 29, 1, 421 und 210. Richtig ist 29, denn
          225 minus 196 ist 29."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Potenzen und Zehnerpotenzen“ auf seiner Kartenseite: [Potenzen
          und Zehnerpotenzen](https://lernapps.net/apps/map/mathematik/c/potenzen/)."
  - type: section
    id: zahlen-vergleichen-ordnen
    title: Zahlen vergleichen und ordnen
    blocks:
      - type: definition
        term: Zahlengerade
        explanation:
          Auf der Zahlengerade hat jede Zahl ihren Platz. Rechts liegt immer die größere Zahl, links die kleinere.
          Links von der 0 liegen die negativen Zahlen.
      - type: text
        text:
          Zahlen vergleichst du Stelle für Stelle von links. Hat eine Zahl mehr Stellen, ist sie größer (bei natürlichen Zahlen).
          Du schreibst $a < b$, wenn $a$ links von $b$ liegt.
      - type: example
        title: Welche Zahl ist größer?
        blocks:
          - type: text
            text:
              1250 und 1205 haben beide vier Stellen. Die Tausender und Hunderter sind gleich. Bei den Zehnern ist 5 größer
              als 0, also gilt $1250 > 1205$.
      - type: vue-component
        id: test-ordnen
        component: Kurztest
        props:
          question: "Welche Zahl ist die kleinste: 0,3; 0,25; 0,125 oder 0,2?"
          options:
            - text: 0,125
              correct: true
              info:
                Bei den Zehnteln steht bei 0,125 nur die 1, bei den anderen 2 oder 3. Mehr Stellen heißt bei Dezimalzahlen nicht
                größer.
            - text: 0,2
              correct: false
              info: 0,2 hat 2 Zehntel, 0,125 hat nur 1 Zehntel.
            - text: 0,25
              correct: false
              info: 0,25 hat 2 Zehntel, 0,125 nur 1.
            - text: 0,3
              correct: false
              info: 0,3 hat 3 Zehntel, 0,125 nur 1 Zehntel.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Welche Zahl ist die kleinste: 0,3, 0,25, 0,125 oder 0,2? Richtig ist 0,125, denn bei den Zehnteln steht
          dort nur die 1."
      - type: vue-component
        id: test-dezimal-ordnen
        component: Kurztest
        props:
          question: "Welche Zahl ist größer: 1,41 oder 1,5?"
          options:
            - text: 1,41
              correct: false
              info: "Du hast 41 und 5 verglichen. Vergleiche Stelle für Stelle: Bei den Zehnteln steht 4 gegen 5."
            - text: 1,5
              correct: true
              info: Bei den Zehnteln ist 5 größer als 4, also 1,5 > 1,41.
            - text: beide sind gleich
              correct: false
              info: 1,5 ist 1,50, und 1,50 ist größer als 1,41.
            - text: das lässt sich nicht sagen
              correct: false
              info: Du kannst Dezimalzahlen Stelle für Stelle vergleichen.
          right: Richtig.
          wrong: Nicht richtig.
        nojs: "Kurztest: Welche Zahl ist größer, 1,41 oder 1,5? Richtig ist 1,5, denn bei den Zehnteln ist 5 größer als 4."
      - type: vue-component
        id: test-ordnen-negativ
        component: Kurztest
        props:
          question: Welche Reihenfolge ist richtig, von klein nach groß?
          options:
            - text: −2; −0,5; 1
              correct: true
              info: Auf der Zahlengerade liegt −2 links von −0,5, und −0,5 liegt links von 1.
            - text: −0,5; −2; 1
              correct: false
              info: −2 liegt weiter links als −0,5, ist also kleiner.
            - text: 1; −0,5; −2
              correct: false
              info: Das ist die Reihenfolge von groß nach klein.
            - text: −0,5; 1; −2
              correct: false
              info: −2 ist die kleinste der drei Zahlen und gehört nach vorn.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Welche Reihenfolge ist richtig, von klein nach groß? Minus 2, minus 0,5, 1. Richtig ist: minus 2, minus
          0,5, 1, denn auf der Zahlengerade liegen sie in dieser Reihenfolge von links nach rechts."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Zahlen vergleichen und ordnen“ auf seiner Kartenseite: [Zahlen
          vergleichen und ordnen](https://lernapps.net/apps/map/mathematik/c/zahlen-vergleichen-ordnen/)."
  - type: section
    id: dezimalbrueche-rechnen
    title: Rechnen mit Dezimalbrüchen
    blocks:
      - type: definition
        term: Dezimalbruch
        explanation:
          Ein Dezimalbruch (eine Dezimalzahl) ist eine Zahl mit Komma, zum Beispiel 3,25. Hinter dem Komma stehen Zehntel,
          Hundertstel, Tausendstel und so weiter.
      - type: text
        text:
          Beim Malnehmen rechnest du erst ohne Komma. Dann setzt du im Ergebnis so viele Stellen hinter das Komma, wie beide
          Faktoren zusammen hatten.
      - type: example
        title: 0,4 mal 1,5
        blocks:
          - type: text
            text:
              'Ohne Komma: $4 \cdot 15 = 60$. Die Faktoren haben zusammen zwei Stellen hinter dem Komma, also gilt $0{,}4 \cdot
              1{,}5 = 0{,}60 = 0{,}6$.'
      - type: vue-component
        id: test-dezimal
        component: Kurztest
        props:
          question: Was ist 0,12 · 0,5?
          options:
            - text: 0,62
              correct: false
              info: Das wäre 0,12 + 0,5. Hier wird malgenommen.
            - text: 0,06
              correct: true
              info: "12 · 5 = 60, drei Stellen hinter dem Komma: 0,060 = 0,06."
            - text: 0,6
              correct: false
              info: Ohne Komma ist 12 · 5 = 60. Die Faktoren haben aber zusammen drei Stellen hinter dem Komma.
            - text: 0,006
              correct: false
              info: Das wären vier Stellen. Die Faktoren haben zusammen drei.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 0,12 mal 0,5? Zur Wahl stehen 0,06, 0,6, 0,006 und 0,62. Richtig ist 0,06, denn 12 mal 5 ist
          60 und es gibt zusammen drei Stellen hinter dem Komma."
      - type: vue-component
        id: test-dezimal-quadrat
        component: Kurztest
        props:
          question: Was ist 1,5 · 1,5?
          options:
            - text: 0,225
              correct: false
              info: Das wären drei Stellen. Die Faktoren haben zusammen zwei.
            - text: 2,25
              correct: true
              info: "15 · 15 = 225, zwei Stellen hinter dem Komma: 2,25."
            - text: 2,5
              correct: false
              info: Zwei Faktoren haben zusammen zwei Stellen hinter dem Komma, also 2,25 und nicht 2,5.
            - text: "3"
              correct: false
              info: Das ist 1,5 + 1,5. Hier wird malgenommen.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 1,5 mal 1,5? Zur Wahl stehen 2,25, 2,5, 3 und 0,225. Richtig ist 2,25, denn 15 mal 15 ist 225
          und es gibt zusammen zwei Stellen hinter dem Komma."
      - type: vue-component
        id: test-bruch-dezimal
        component: Kurztest
        props:
          question: Welcher Bruch ist 0,25?
          options:
            - text: ½
              correct: false
              info: Ein Halb ist 0,5.
            - text: ⅕
              correct: false
              info: Ein Fünftel ist 0,2.
            - text: ¾
              correct: false
              info: Drei Viertel sind 0,75.
            - text: ¼
              correct: true
              info: "Ein Viertel ist 1 : 4 = 0,25."
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Welcher Bruch ist 0,25? Ein Viertel, ein Halb, ein Fünftel oder drei Viertel. Richtig ist ein Viertel,
          denn 1 geteilt durch 4 ist 0,25."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Rechnen mit Dezimalbrüchen“ auf seiner Kartenseite: [Rechnen
          mit Dezimalbrüchen](https://lernapps.net/apps/map/mathematik/c/dezimalbrueche-rechnen/)."
  - type: section
    id: rationale-zahlen-rechnen
    title: Rechnen mit negativen Zahlen
    blocks:
      - type: definition
        term: Vorzeichenregel
        explanation:
          'Beim Malnehmen und Teilen gilt: gleiche Vorzeichen ergeben plus, verschiedene Vorzeichen ergeben minus.
          Zum Beispiel ist $(-3) \cdot (-4) = 12$ und $(-3) \cdot 4 = -12$.'
      - type: text
        text:
          'Auf der Seite zu den reellen Zahlen kommen Brüche vor: Ein Bruch wie $\frac{6}{8}$ lässt sich zu $\frac{3}{4}$
          kürzen. Gerade Zahlen sind durch 2 teilbar, ungerade nicht.'
      - type: text
        text:
          Eine negative Zahl in einer Rechnung steht in Klammern. Beim Addieren einer negativen Zahl gehst du auf der Zahlengerade
          nach links.
      - type: example
        title: 5 + (−8)
        blocks:
          - type: text
            text: "Du startest bei 5 und gehst 8 Schritte nach links: $5 + (-8) = -3$."
      - type: vue-component
        id: test-vorzeichen
        component: Kurztest
        props:
          question: Was ist (−4) · (−3) − 5?
          options:
            - text: "7"
              correct: true
              info: (−4) · (−3) = 12, dann 12 − 5 = 7.
            - text: "17"
              correct: false
              info: Du hast 12 + 5 gerechnet. Das Minus vor der 5 gehört zur Rechnung.
            - text: −17
              correct: false
              info: "Minus mal minus ergibt plus: Das Produkt ist +12, nicht −12."
            - text: −7
              correct: false
              info: Du hast −12 + 5 gerechnet. Minus mal minus ergibt aber +12.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist minus 4 mal minus 3 minus 5? Zur Wahl stehen 7, 17, minus 17 und minus 7. Richtig ist 7, denn
          minus 4 mal minus 3 ist 12 und 12 minus 5 ist 7."
      - type: vue-component
        id: test-negativ-addieren
        component: Kurztest
        props:
          question: Was ist 5 + (−8)?
          options:
            - text: "13"
              correct: false
              info: Du hast 5 + 8 gerechnet. Die Klammer (−8) bedeutet, dass du 8 abziehst.
            - text: −13
              correct: false
              info: Das wäre −5 − 8. Hier startest du bei +5.
            - text: −3
              correct: true
              info: "Du startest bei 5 und gehst 8 Schritte nach links: −3."
            - text: "3"
              correct: false
              info: Das Ergebnis ist negativ, denn du gehst weiter nach links als bis 0.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 5 plus minus 8? Zur Wahl stehen minus 3, 3, 13 und minus 13. Richtig ist minus 3, denn du startest
          bei 5 und gehst 8 Schritte nach links."
      - type: vue-component
        id: test-negativ-subtrahieren
        component: Kurztest
        props:
          question: Was ist 7 − (−10)?
          options:
            - text: −17
              correct: false
              info: Das Ergebnis ist größer als 7, nicht negativ.
            - text: "3"
              correct: false
              info: Das wäre 10 − 7. Du startest bei 7 und gehst nach rechts.
            - text: "17"
              correct: true
              info: "Minus eine negative Zahl ist plus: 7 + 10 = 17."
            - text: −3
              correct: false
              info: Das wäre 7 + (−10). Hier wird aber (−10) abgezogen.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 7 minus minus 10? Zur Wahl stehen 17, minus 3, minus 17 und 3. Richtig ist 17, denn minus eine
          negative Zahl ist plus."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Rechnen mit negativen Zahlen“ auf seiner Kartenseite: [Rechnen
          mit negativen Zahlen](https://lernapps.net/apps/map/mathematik/c/rationale-zahlen-rechnen/)."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text:
          "- Potenzen mit natürlichen Exponenten berechnen und Zehnerpotenzen zum Schreiben großer Zahlen nutzen kannst.

          - Zahlen vergleichen, auf der Zahlengerade zuordnen und der Größe nach ordnen kannst.

          - mit Dezimalbrüchen rechnen kannst.

          - mit negativen Zahlen rechnen und dabei Vorzeichen- und Klammerregeln beachten kannst.


          Hattest du bei jedem Kurztest alles richtig, geht es weiter: Zur Fläche eines Quadrats ist die Seite gesucht. Sonst
          wiederhole zuerst den Baustein, bei dem du unsicher warst."
