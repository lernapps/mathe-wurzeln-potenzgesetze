# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: Vier Bausteine aus früheren Jahren, die du für Wurzeln und reelle Zahlen brauchst, mit Kurztests zum Prüfen.
recap:
  - mathematik/potenzen
  - mathematik/zahlen-vergleichen-ordnen
  - mathematik/dezimalbrueche-rechnen
  - mathematik/rationale-zahlen-rechnen
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text:
          "Für Wurzeln und reelle Zahlen brauchst du vier Dinge aus früheren Jahren: Potenzen, Zahlen ordnen, Dezimalbrüche
          und negative Zahlen. Lies jeden Abschnitt kurz und beantworte den Kurztest. Er zählt nichts und speichert nichts, er
          zeigt dir nur, ob du es kannst. Bei einer falschen Antwort steht darunter, was du wiederholen kannst."
  - type: section
    id: potenzen
    title: Potenzen und Zehnerpotenzen
    blocks:
      - type: definition
        term: Potenz
        explanation: 'Eine Potenz schreibt ein Produkt aus gleichen Faktoren kurz auf: $2^3 = 2 \cdot 2 \cdot 2 = 8$.'
      - type: definition
        term: Basis
        explanation: Die Basis ist der Faktor, der wiederholt wird. In $2^3$ ist 2 die Basis.
      - type: definition
        term: Exponent
        explanation: Der Exponent sagt, wie oft die Basis als Faktor steht. In $2^3$ ist 3 der Exponent.
      - type: definition
        term: Quadratzahl
        explanation:
          Eine Quadratzahl ist eine Zahl mit dem Exponenten 2, zum Beispiel $7^2 = 49$. Die ersten Quadratzahlen sind
          1, 4, 9, 16, 25, 36, 49, 64, 81 und 100.
      - type: definition
        term: Zehnerpotenz
        explanation:
          Eine Zehnerpotenz hat die Basis 10, zum Beispiel $10^3 = 10 \cdot 10 \cdot 10 = 1000$. Der Exponent zählt
          die Nullen.
      - type: example
        title: Eine große Zahl kurz geschrieben
        blocks:
          - type: text
            text:
              Die Erde ist rund $15 \cdot 10^7$ Kilometer von der Sonne entfernt. $10^7$ ist eine 1 mit sieben Nullen, also
              10 000 000. Das Ergebnis ist 150 000 000 Kilometer.
      - type: vue-component
        id: test-potenz
        component: Kurztest
        props:
          question: Was ist 4³?
          options:
            - text: "12"
              correct: false
              info: Das ist 4 · 3. Der Exponent 3 sagt aber, wie oft die 4 als Faktor steht.
            - text: "64"
              correct: true
              info: 4³ = 4 · 4 · 4 = 64.
            - text: "81"
              correct: false
              info: Das ist 3⁴. Basis und Exponent sind vertauscht.
            - text: "7"
              correct: false
              info: Das ist 4 + 3. Eine Potenz ist ein Produkt aus gleichen Faktoren.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 4 hoch 3? Zur Wahl stehen 12, 64, 81 und 7. Richtig ist 64, denn 4 mal 4 mal 4 ist 64. 12 ist
          4 mal 3, 81 ist 3 hoch 4, 7 ist 4 plus 3."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Potenzen und Zehnerpotenzen“ auf seiner Kartenseite: [Potenzen
          und Zehnerpotenzen](https://lernapps.net/apps/map/mathematik/c/potenzen/)."
  - type: section
    id: zahlen-vergleichen-ordnen
    title: Zahlen vergleichen und ordnen
    blocks:
      - type: definition
        term: Zahlengerade
        explanation:
          Auf der Zahlengerade hat jede Zahl ihren Platz. Rechts liegt immer die größere Zahl, links die kleinere.
          Links von der 0 liegen die negativen Zahlen.
      - type: text
        text:
          Zahlen vergleichst du Stelle für Stelle von links. Hat eine Zahl mehr Stellen, ist sie größer (bei natürlichen Zahlen).
          Du schreibst $a < b$, wenn $a$ links von $b$ liegt.
      - type: example
        title: Welche Zahl ist größer?
        blocks:
          - type: text
            text:
              1250 und 1205 haben beide vier Stellen. Die Tausender und Hunderter sind gleich. Bei den Zehnern ist 5 größer
              als 0, also gilt $1250 > 1205$.
      - type: vue-component
        id: test-ordnen
        component: Kurztest
        props:
          question: Welche Zahl ist die größte?
          options:
            - text: "987"
              correct: false
              info: 987 hat nur drei Stellen, 1009 hat vier.
            - text: "999"
              correct: false
              info: 999 hat nur drei Stellen.
            - text: "1009"
              correct: true
              info: 1009 hat vier Stellen und ist damit größer als jede dreistellige Zahl.
            - text: "989"
              correct: false
              info: 989 hat nur drei Stellen.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Welche Zahl ist die größte? 987, 999, 1009 oder 989. Richtig ist 1009, weil sie vier Stellen hat und
          die anderen nur drei."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Zahlen vergleichen und ordnen“ auf seiner Kartenseite: [Zahlen
          vergleichen und ordnen](https://lernapps.net/apps/map/mathematik/c/zahlen-vergleichen-ordnen/)."
  - type: section
    id: dezimalbrueche-rechnen
    title: Rechnen mit Dezimalbrüchen
    blocks:
      - type: definition
        term: Dezimalbruch
        explanation:
          Ein Dezimalbruch ist eine Zahl mit Komma, zum Beispiel 3,25. Hinter dem Komma stehen Zehntel, Hundertstel,
          Tausendstel und so weiter.
      - type: text
        text:
          Beim Malnehmen rechnest du erst ohne Komma. Dann setzt du im Ergebnis so viele Stellen hinter das Komma, wie beide
          Faktoren zusammen hatten.
      - type: example
        title: 0,4 mal 1,5
        blocks:
          - type: text
            text:
              'Ohne Komma: $4 \cdot 15 = 60$. Die Faktoren haben zusammen zwei Stellen hinter dem Komma, also gilt $0{,}4 \cdot
              1{,}5 = 0{,}60 = 0{,}6$.'
      - type: vue-component
        id: test-dezimal
        component: Kurztest
        props:
          question: Was ist 0,3 · 0,2?
          options:
            - text: 0,6
              correct: false
              info: Ohne Komma ist 3 · 2 = 6. Beide Faktoren haben aber zusammen zwei Stellen hinter dem Komma.
            - text: 0,06
              correct: true
              info: "3 · 2 = 6, zwei Stellen hinter dem Komma: 0,06."
            - text: 0,5
              correct: false
              info: Das ist 0,3 + 0,2. Hier wird aber malgenommen.
            - text: 0,006
              correct: false
              info: Das wären drei Stellen. Die Faktoren haben zusammen nur zwei.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 0,3 mal 0,2? Zur Wahl stehen 0,6, 0,06, 0,5 und 0,006. Richtig ist 0,06, denn 3 mal 2 ist 6 und
          es gibt zusammen zwei Stellen hinter dem Komma."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Rechnen mit Dezimalbrüchen“ auf seiner Kartenseite: [Rechnen
          mit Dezimalbrüchen](https://lernapps.net/apps/map/mathematik/c/dezimalbrueche-rechnen/)."
  - type: section
    id: rationale-zahlen-rechnen
    title: Rechnen mit negativen Zahlen
    blocks:
      - type: definition
        term: Vorzeichenregel
        explanation:
          'Beim Malnehmen und Teilen gilt: gleiche Vorzeichen ergeben plus, verschiedene Vorzeichen ergeben minus.
          Zum Beispiel ist $(-3) \cdot (-4) = 12$ und $(-3) \cdot 4 = -12$.'
      - type: text
        text:
          Eine negative Zahl in einer Rechnung steht in Klammern. Beim Addieren einer negativen Zahl gehst du auf der Zahlengerade
          nach links.
      - type: example
        title: 5 plus minus 8
        blocks:
          - type: text
            text: "Du startest bei 5 und gehst 8 Schritte nach links: $5 + (-8) = -3$."
      - type: vue-component
        id: test-vorzeichen
        component: Kurztest
        props:
          question: Was ist (−6) · (−2)?
          options:
            - text: "12"
              correct: true
              info: "Zwei gleiche Vorzeichen (beide minus) ergeben plus: 6 · 2 = 12."
            - text: −12
              correct: false
              info: Minus mal minus ergibt plus, nicht minus.
            - text: −8
              correct: false
              info: Das ist (−6) + (−2). Hier wird aber malgenommen.
            - text: "8"
              correct: false
              info: Das ist 6 + 2. Malnehmen ist hier gefragt.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist minus 6 mal minus 2? Zur Wahl stehen 12, minus 12, minus 8 und 8. Richtig ist 12, denn minus
          mal minus ergibt plus."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Rechnen mit negativen Zahlen“ auf seiner Kartenseite: [Rechnen
          mit negativen Zahlen](https://lernapps.net/apps/map/mathematik/c/rationale-zahlen-rechnen/)."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text:
          "- Potenzen mit natürlichen Exponenten berechnen und Zehnerpotenzen zum Schreiben großer Zahlen nutzen kannst.

          - Zahlen vergleichen, auf der Zahlengerade zuordnen und der Größe nach ordnen kannst.

          - mit Dezimalbrüchen rechnen kannst.

          - mit negativen Zahlen rechnen und dabei Vorzeichen- und Klammerregeln beachten kannst.


          Dann geht es auf der nächsten Seite los: Zur Fläche eines Quadrats ist die Seite gesucht."
