# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Potenzgesetze: Produkt und Quotient"
description: "Potenzen mit gleicher Basis multiplizieren und dividieren: Du zählst die Faktoren und erhältst die Exponentenregeln."
competencies:
  - potenzgesetze
blocks:
  - type: section
    id: einstieg
    title: Erste Aufgabe
    blocks:
      - type: text
        text:
          Die Reise beginnt bei der Erde. Ihr Durchmesser ist rund 10 000 000 m, also rund $10^7$ m. Die Sonne ist rund $10^{11}$
          m entfernt. Am Ende dieser Seite kannst du solche Zahlen miteinander malnehmen und teilen, ohne die Nullen zu zählen.
      - type: number
        id: zweier-zaehlen
        text: Schreibe 2³ · 2⁴ als Produkt aus lauter Zweien. Wie viele Zweien sind es?
        answer: 7
        tolerance: 0
        mistakes:
          - answer: 12
            message: "Du hast 3 mal 4 gerechnet. Zähle die Faktoren: 3 Zweien und 4 Zweien stehen nebeneinander."
        hint: Schreibe beide Potenzen aus und zähle alle Zweien.
        explanation: 2³ = 2·2·2 und 2⁴ = 2·2·2·2. Zusammen stehen 3 + 4 = 7 Zweien in einer Reihe.
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/potenzgesetze/
  - type: section
    id: idee
    title: Faktoren ausschreiben und zählen
    blocks:
      - type: text
        text: "Du schreibst die Potenzen aus. Bei gleicher Basis stehen die Faktoren in einer Reihe, und du zählst sie:"
      - type: table
        caption: Produkt und Quotient bei gleicher Basis
        header:
          - Aufgabe
          - Ausgeschrieben
          - Ergebnis
        rows:
          - - $a^3 \cdot a^4$
            - $(a \cdot a \cdot a) \cdot (a \cdot a \cdot a \cdot a)$
            - $a^7$
          - - "$a^5 : a^2$"
            - $\frac{a \cdot a \cdot a \cdot a \cdot a}{a \cdot a}$
            - $a^3$
      - type: text
        text:
          "Beim Malnehmen werden die Exponenten addiert: 3 + 4 = 7. Beim Teilen kürzt du gleiche Faktoren, die Exponenten
          werden subtrahiert: 5 − 2 = 3. Das gilt für jede Basis $a$ ungleich 0."
  - type: section
    id: regel
    title: Die Gesetze
    blocks:
      - type: formula
        formula: a^m \cdot a^n = a^{m+n}
      - type: formula
        formula: "a^m : a^n = a^{m-n}"
      - type: text
        text: Beim Teilen ist $m$ größer als $n$. Was passiert, wenn $m$ kleiner ist, siehst du auf einer der nächsten Seiten.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Von der Erde zur Sonne
        blocks:
          - type: text
            text: "Wie oft passt der Erddurchmesser $10^7$ m in die Entfernung $10^{11}$ m? Du teilst:"
          - type: formula
            formula: "10^{11} : 10^{7} = 10^{11-7} = 10^4"
          - type: text
            text: Es sind rund 10 000-mal. Genauer sind es etwa 12 000, aber die Größenordnung stimmt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: produkt-potenzen
        given:
          b:
            oneOf:
              - 2
              - 3
              - 5
              - 10
          m:
            int:
              - 2
              - 7
          n:
            int:
              - 2
              - 7
        where:
          - m * n != m + n
        task:
          text: Es gilt {{b}}^{{m}} · {{b}}^{{n}} = {{b}}^k. Wie groß ist k?
        answer:
          value: m + n
          compare:
            number:
              format: integer
        mistakes:
          - value: m * n
            message: Du hast die Exponenten multipliziert. Bei gleicher Basis werden sie beim Malnehmen addiert.
          - value: m - n
            message: Du hast subtrahiert. Das passiert beim Teilen, nicht beim Malnehmen.
        hint: Schreibe beide Potenzen aus und zähle alle Faktoren {{b}}.
        steps:
          - "{{b}}^{{m}} · {{b}}^{{n}} = {{b}}^({{m}} + {{n}})"
          - Also k = {{answer}}.
      - type: generated
        id: quotient-potenzen
        given:
          b:
            oneOf:
              - 2
              - 3
              - 5
              - 10
          m:
            int:
              - 4
              - 9
          n:
            int:
              - 1
              - 3
        task:
          text: "Es gilt {{b}}^{{m}} : {{b}}^{{n}} = {{b}}^k. Wie groß ist k?"
        answer:
          value: m - n
          compare:
            number:
              format: integer
        mistakes:
          - value: m + n
            message: Du hast addiert. Das passiert beim Malnehmen. Beim Teilen kürzt du Faktoren.
          - value: m * n
            message: Du hast die Exponenten multipliziert. Beim Teilen bleiben nach dem Kürzen m minus n Faktoren übrig.
        hint: Streiche gleiche Faktoren im Zähler und im Nenner. Wie viele bleiben übrig?
        steps:
          - "{{b}}^{{m}} : {{b}}^{{n}} = {{b}}^({{m}} − {{n}})"
          - Also k = {{answer}}.
      - type: single-choice
        id: umformung
        text: Welche Umformung stimmt?
        options:
          - text: 3⁴ · 3⁵ = 3⁹
            correct: true
            info: "Gleiche Basis 3: Die Exponenten werden addiert, 4 + 5 = 9."
          - text: 3⁴ · 3⁵ = 9⁹
            correct: false
            info: Die Basis bleibt 3. Sie wird nicht mit sich selbst malgenommen.
          - text: 3⁴ · 3⁵ = 3²⁰
            correct: false
            info: Die Exponenten werden addiert, nicht multipliziert.
          - text: 3⁴ · 3⁵ = 9²⁰
            correct: false
            info: "Hier ist die Basis falsch und der Exponent: Basis bleibt 3, Exponenten werden addiert."
        explanation: "Bei gleicher Basis gilt: Beim Malnehmen werden die Exponenten addiert."
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/potenzgesetze/
      - type: true-false
        id: x-hoch
        text: Es gilt x² · x³ = x⁶.
        answer: false
        explanation: "x² · x³ = (x·x)·(x·x·x) = x⁵. Die Exponenten werden addiert: 2 + 3 = 5."
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/potenzgesetze/
      - type: single-choice
        id: erde-sonne
        text:
          Der Erddurchmesser ist rund 10⁷ m, die Entfernung zur Sonne rund 10¹¹ m. Wie oft passt der Durchmesser ungefähr
          in die Entfernung?
        options:
          - text: 10⁴-mal
            correct: true
            info: "10¹¹ : 10⁷ = 10¹¹⁻⁷ = 10⁴."
          - text: 10¹⁸-mal
            correct: false
            info: Du hast die Exponenten addiert. Beim Teilen werden sie subtrahiert.
          - text: 10⁷⁷-mal
            correct: false
            info: Du hast die Exponenten multipliziert. Beim Teilen werden sie subtrahiert.
          - text: 10⁻⁴-mal
            correct: false
            info: "Du hast in die falsche Richtung gerechnet: Die Entfernung ist größer als der Durchmesser."
        explanation: "Entfernung durch Durchmesser: 10¹¹ : 10⁷ = 10⁴. Die Zehnerpotenzen zeigen die Größenordnung."
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/potenzgesetze/
      - type: number
        id: kombination
        text: "Es gilt 5³ · 5⁴ : 5² = 5^k. Wie groß ist k?"
        answer: 5
        tolerance: 0
        mistakes:
          - answer: 9
            message: Du hast beide Rechenzeichen wie ein Plus behandelt. Beim Teilen subtrahierst du.
        hint: "Rechne von links nach rechts: erst das Produkt, dann den Quotienten."
        explanation: "Erst malnehmen: 5³ · 5⁴ = 5⁷. Dann teilen: 5⁷ : 5² = 5⁵."
        links:
          - title: Baustein auf der Lernlandkarte
            url: https://lernapps.net/apps/map/mathematik/c/potenzgesetze/
      - type: text
        text: "Auf der nächsten Seite geht die Reise weiter, mit Potenzen von Potenzen: Aus Metern werden Quadratkilometer."
