# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für die Potenzgesetze
description: "Zwei Bausteine, die du für die Potenzgesetze brauchst: Terme umformen und Potenzen, mit zwei Aufgaben zum Prüfen."
recap:
  - mathematik/terme-umformen
  - mathematik/potenzen
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text:
          "Für die Potenzgesetze brauchst du zwei Dinge: Terme umformen und Potenzen mit natürlichen Exponenten. Lies jeden
          Abschnitt kurz. Am Ende prüfen zwei Aufgaben, ob du es kannst. Sie zählen nichts und speichern nichts. Unter jedem Abschnitt
          steht, was du wiederholen kannst, wenn du unsicher warst. Hast du beide Aufgaben richtig, bist du bereit. Die dritte
          Wurzel baut auf der Quadratwurzel aus dem Kapitel „Wurzeln und neue Zahlen“ auf; lies dort zuerst „Quadratwurzel bestimmen“,
          falls du sie noch nicht kennst."
  - type: section
    id: terme-umformen
    title: Terme umformen
    blocks:
      - type: definition
        term: gleichartige Glieder
        explanation:
          "Gleichartige Glieder haben dieselbe Variable mit demselben Exponenten, zum Beispiel $3x$ und $5x$. Du fasst
          sie zusammen, indem du die Zahlen davor addierst: $3x + 5x = 8x$."
      - type: definition
        term: Ausklammern
        explanation:
          'Beim Ausklammern ziehst du einen gemeinsamen Faktor vor eine Klammer: $6x + 9 = 3 \cdot (2x + 3)$. Die Probe
          geht rückwärts: Du multiplizierst die Klammer aus.'
      - type: example
        title: Zusammenfassen und ausklammern
        blocks:
          - type: text
            text: Aus $4a + 7a - 2a$ wird $9a$. Aus $10b + 15$ wird $5 \cdot (2b + 3)$.
      - type: text
        text: "Wenn du hier unsicher warst: Wiederhole den Baustein „Terme umformen“ auf seiner Kartenseite: [Terme umformen](https://lernapps.net/apps/map/mathematik/c/terme-umformen/)."
  - type: section
    id: potenzen
    title: Potenzen und Zehnerpotenzen
    blocks:
      - type: text
        text:
          'Eine **Potenz** schreibt ein Produkt aus gleichen Faktoren kurz: $2^5 = 2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$.
          Die **Basis** ist 2, der **Exponent** ist 5. Eine **Zehnerpotenz** hat die Basis 10, der Exponent zählt die Nullen:
          $10^4$ = 10 000 hat vier Nullen.'
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Potenzen und Zehnerpotenzen“ auf seiner Kartenseite: [Potenzen
          und Zehnerpotenzen](https://lernapps.net/apps/map/mathematik/c/potenzen/)."
  - type: section
    id: kannst-du-das
    title: Kannst du das?
    blocks:
      - type: text
        text:
          Wenn du nicht sicher bist, ob du die beiden Bausteine kannst, prüfen zwei Aufgaben sie zusammen. Du bekommst sofort
          eine Rückmeldung, und nichts wird gezählt.
      - type: single-choice
        id: terme-zusammenfassen
        text: Was ergibt 4x + 3 − x + 5?
        options:
          - text: 3x + 8
            correct: true
            info: 4x − x = 3x und 3 + 5 = 8.
          - text: 8x
            correct: false
            info: Zahlen ohne x und Glieder mit x lassen sich nicht zusammenfassen.
          - text: 5x + 8
            correct: false
            info: "Das Minus vor x gehört zum Glied: 4x − x = 3x, nicht 5x."
          - text: 3x − 2
            correct: false
            info: Du hast 3 − 5 gerechnet. Die 5 wird addiert.
        explanation: "Du fasst die Glieder mit x und die Zahlen getrennt zusammen: 4x − x = 3x und 3 + 5 = 8."
      - type: number
        id: potenz-differenz
        text: Was ist 2⁵ − 5²?
        answer: 7
        tolerance: 0
        mistakes:
          - answer: 0
            message:
              "Du hast 2 · 5 und 5 · 2 gerechnet. Eine Potenz ist ein Produkt aus gleichen Faktoren: 2⁵ ist 2 · 2 · 2 · 2
              · 2."
          - answer: -7
            message: Du hast 25 − 32 gerechnet. Die erste Zahl ist 2⁵.
          - answer: 3
            message: Das wäre 5 − 2. Hier werden Potenzen abgezogen.
        hint: Rechne erst beide Potenzen aus.
        explanation: 2⁵ = 32 und 5² = 25, also 32 − 25 = 7.
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: "- gleichartige Glieder zusammenfassen und gemeinsame Faktoren ausklammern kannst.

          - Potenzen mit natürlichen Exponenten berechnen und Zehnerpotenzen zum Schreiben großer Zahlen nutzen kannst.


          Hattest du beide Aufgaben richtig, beginnt die Reise: vom Proton bis zum Universum, mit Zehnerpotenzen. Sonst wiederhole
          zuerst den Baustein, bei dem du unsicher warst."
