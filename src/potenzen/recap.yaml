# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für die Potenzgesetze
description: "Zwei Bausteine, die du für die Potenzgesetze brauchst: Terme umformen und Potenzen, mit zwei Aufgaben zum Prüfen."
recap:
  - mathematik/terme-umformen
  - mathematik/potenzen
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text:
          "Für die Potenzgesetze brauchst du zwei Dinge: Terme umformen und Potenzen mit natürlichen Exponenten. Lies jeden
          Abschnitt kurz. Am Ende prüfen zwei Aufgaben, ob du es kannst. Sie zählen nichts und speichern nichts. Unter jedem Abschnitt
          steht, was du wiederholen kannst, wenn du unsicher warst. Die dritte Wurzel baut auf der Quadratwurzel aus dem Kapitel
          „Wurzeln und neue Zahlen“ auf; lies dort zuerst „Quadratwurzel bestimmen“, falls du sie noch nicht kennst."
  - type: section
    id: terme-umformen
    title: Terme umformen
    blocks:
      - type: text
        text: Wenn du später Potenzen mit Variablen verrechnest, fasst du Glieder zusammen und klammerst aus.
      - type: definition
        term: gleichartige Glieder
        explanation:
          "Gleichartige Glieder haben dieselbe Variable mit demselben Exponenten, zum Beispiel $3x$ und $5x$. Du fasst
          sie zusammen, indem du die Zahlen davor addierst: $3x + 5x = 8x$."
      - type: definition
        term: Ausklammern
        explanation:
          'Beim Ausklammern ziehst du einen gemeinsamen Faktor vor eine Klammer: $6x + 9 = 3 \cdot (2x + 3)$. Die Probe
          geht rückwärts: Du multiplizierst die Klammer aus.'
      - type: example
        title: Zusammenfassen und ausklammern
        blocks:
          - type: text
            text: Aus $4a + 7a - 2a$ wird $9a$. Aus $10b + 15$ wird $5 \cdot (2b + 3)$.
      - type: text
        text: "Wenn du hier unsicher warst: Wiederhole den Baustein „Terme umformen“ auf seiner Kartenseite: [Terme umformen](https://lernapps.net/apps/map/mathematik/c/terme-umformen/)."
  - type: section
    id: potenzen
    title: Potenzen und Zehnerpotenzen
    blocks:
      - type: text
        text: Wenn du Potenzen verrechnen willst, musst du Potenzen und Zehnerpotenzen sicher schreiben und berechnen.
      - type: text
        text:
          'Eine **Potenz** schreibt ein Produkt aus gleichen Faktoren kurz: $2^5 = 2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$.
          Die **Basis** ist 2, der **Exponent** ist 5. Eine **Zehnerpotenz** hat die Basis 10, der Exponent zählt die Nullen:
          $10^4$ = 10 000 hat vier Nullen.'
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Potenzen und Zehnerpotenzen“ auf seiner Kartenseite: [Potenzen
          und Zehnerpotenzen](https://lernapps.net/apps/map/mathematik/c/potenzen/)."
  - type: section
    id: kannst-du-das
    title: Kannst du das?
    blocks:
      - type: text
        text: Wenn du nicht sicher bist, ob du die beiden Bausteine kannst, prüfen zwei Aufgaben sie zusammen.
      - type: single-choice
        id: terme-ausklammern
        text: Klammere 12a + 18b so weit wie möglich aus.
        options:
          - text: 6 · (2a + 3b)
            correct: true
            info: 6 ist der größte gemeinsame Teiler von 12 und 18.
          - text: 3 · (4a + 6b)
            correct: false
            info: "Das ist ausgeklammert, aber nicht so weit wie möglich: In der Klammer haben 4 und 6 noch den Teiler 2."
          - text: 2 · (6a + 9b)
            correct: false
            info: "Das ist ausgeklammert, aber nicht so weit wie möglich: In der Klammer haben 6 und 9 noch den Teiler 3."
          - text: 12 · (a + 18b)
            correct: false
            info: "Der Faktor 12 gehört auch zu 18b: Ausmultipliziert gäbe das 12a + 216b."
        explanation: "Du suchst den größten Faktor, der in beiden Gliedern steckt: 6 passt in 12a und in 18b."
      - type: number
        id: potenz-zehnerpotenz
        text: "Berechne 2⁵ − 5² + 10³ : 100."
        answer: 17
        tolerance: 0
        mistakes:
          - answer: 7
            message: "Du hast 10³ : 100 = 10 vergessen."
          - answer: 3
            message: Du hast 5² − 2⁵ gerechnet. Die erste Zahl ist 2⁵.
          - answer: 7.3
            message: 10³ ist nicht 10 · 3. Es ist eine 1 mit drei Nullen, also 1000.
        hint: Rechne erst die drei Potenzen aus, dann von links nach rechts.
        explanation: "2⁵ = 32 und 5² = 25, also 7. 10³ = 1000, und 1000 : 100 = 10. Zusammen 17."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: "- gleichartige Glieder zusammenfassen und gemeinsame Faktoren ausklammern kannst.

          - Potenzen mit natürlichen Exponenten berechnen und Zehnerpotenzen zum Schreiben großer Zahlen nutzen kannst.


          Hattest du beide Aufgaben richtig, beginnt die Reise: vom Proton bis zum Universum, mit Zehnerpotenzen. Sonst wiederhole
          zuerst den Baustein, bei dem du unsicher warst."
