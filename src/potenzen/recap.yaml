# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für die Potenzgesetze
description: "Zwei Bausteine, die du für die Potenzgesetze brauchst: Terme umformen und Potenzen, mit Kurztests zum Prüfen."
recap:
  - mathematik/terme-umformen
  - mathematik/potenzen
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text:
          "Für die Potenzgesetze brauchst du zwei Dinge: Terme umformen und Potenzen mit natürlichen Exponenten. Lies jeden
          Abschnitt kurz und beantworte die Kurztests. Sie zählen nichts und speichern nichts. Unter jedem Abschnitt steht, was
          du wiederholen kannst, wenn du unsicher warst. Hast du alle Kurztests richtig, bist du bereit. Die dritte Wurzel baut
          auf der Quadratwurzel aus dem Kapitel „Wurzeln und neue Zahlen“ auf; lies dort zuerst „Quadratwurzel bestimmen“, falls
          du sie noch nicht kennst."
  - type: section
    id: terme-umformen
    title: Terme umformen
    blocks:
      - type: definition
        term: gleichartige Glieder
        explanation:
          "Gleichartige Glieder haben dieselbe Variable mit demselben Exponenten, zum Beispiel $3x$ und $5x$. Du fasst
          sie zusammen, indem du die Zahlen davor addierst: $3x + 5x = 8x$."
      - type: definition
        term: Ausklammern
        explanation:
          'Beim Ausklammern ziehst du einen gemeinsamen Faktor vor eine Klammer: $6x + 9 = 3 \cdot (2x + 3)$. Die Probe
          geht rückwärts: Du multiplizierst die Klammer aus.'
      - type: example
        title: Zusammenfassen und ausklammern
        blocks:
          - type: text
            text: Aus $4a + 7a - 2a$ wird $9a$. Aus $10b + 15$ wird $5 \cdot (2b + 3)$.
      - type: vue-component
        id: test-zusammenfassen
        component: Kurztest
        props:
          question: Was ergibt 3a + 5a − 2a?
          options:
            - text: 6a
              correct: true
              info: "3 + 5 − 2 = 6, die Variable a bleibt: 6a."
            - text: "6"
              correct: false
              info: Das a bleibt stehen, denn es ist Teil der gleichartigen Glieder.
            - text: 10a
              correct: false
              info: Du hast − 2a mitaddiert. Das Minus gehört zum Glied.
            - text: 9a²
              correct: false
              info: Beim Zusammenfassen wird die Variable nicht multipliziert, nur die Zahlen davor werden verrechnet.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ergibt 3a plus 5a minus 2a? Zur Wahl stehen 6a, 6, 10a und 9a hoch 2. Richtig ist 6a, denn 3 plus
          5 minus 2 ist 6 und das a bleibt."
      - type: vue-component
        id: test-ausklammern
        component: Kurztest
        props:
          question: Welcher Term ist 6x + 9, ausgeklammert?
          options:
            - text: 9 · (6x + 1)
              correct: false
              info: Ausmultipliziert gäbe das 54x + 9.
            - text: 3 · (2x + 3)
              correct: true
              info: "Ausmultipliziert: 3 · 2x = 6x und 3 · 3 = 9."
            - text: 3 · (2x + 9)
              correct: false
              info: Ausmultipliziert gäbe das 6x + 27. Der Faktor 3 gehört auch zur 9.
            - text: 6 · (x + 9)
              correct: false
              info: Ausmultipliziert gäbe das 6x + 54.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Welcher Term ist 6x plus 9, ausgeklammert? 3 mal (2x plus 3), 3 mal (2x plus 9), 6 mal (x plus 9) oder
          9 mal (6x plus 1). Richtig ist 3 mal (2x plus 3)."
      - type: vue-component
        id: test-variable-mal
        component: Kurztest
        props:
          question: Was ist a · a · a?
          options:
            - text: a + 3
              correct: false
              info: Das ist eine Summe. Hier wird malgenommen.
            - text: 3 · a · a
              correct: false
              info: Dreimal dieselbe Variable heißt dreimal a als Faktor, nicht einmal 3.
            - text: a³
              correct: true
              info: Drei gleiche Faktoren a schreibst du kurz als a³.
            - text: 3a
              correct: false
              info: 3a ist a + a + a. Hier steht aber ein Produkt.
          right: Richtig.
          wrong: Nicht richtig.
        nojs: "Kurztest: Was ist a mal a mal a? Zur Wahl stehen a hoch 3, 3a, a plus 3 und 3 mal a mal a. Richtig ist a hoch 3."
      - type: text
        text: "Wenn du hier unsicher warst: Wiederhole den Baustein „Terme umformen“ auf seiner Kartenseite: [Terme umformen](https://lernapps.net/apps/map/mathematik/c/terme-umformen/)."
  - type: section
    id: potenzen
    title: Potenzen und Zehnerpotenzen
    blocks:
      - type: text
        text:
          'Eine **Potenz** schreibt ein Produkt aus gleichen Faktoren kurz: $2^5 = 2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$.
          Die **Basis** ist 2, der **Exponent** ist 5. Eine **Zehnerpotenz** hat die Basis 10, der Exponent zählt die Nullen:
          $10^4$ = 10 000 hat vier Nullen.'
      - type: vue-component
        id: test-potenz-2
        component: Kurztest
        props:
          question: Was ist 2⁵?
          options:
            - text: "25"
              correct: false
              info: Das ist 5². Basis und Exponent sind vertauscht.
            - text: "16"
              correct: false
              info: Das ist 2⁴. Es sind fünf Faktoren, nicht vier.
            - text: "32"
              correct: true
              info: 2⁵ = 2 · 2 · 2 · 2 · 2 = 32.
            - text: "10"
              correct: false
              info: Das ist 2 · 5. Der Exponent sagt, wie oft die Basis als Faktor steht.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Was ist 2 hoch 5? Zur Wahl stehen 32, 10, 25 und 16. Richtig ist 32, denn 2 mal 2 mal 2 mal 2 mal 2 ist
          32."
      - type: vue-component
        id: test-zehnerpotenz
        component: Kurztest
        props:
          question: Wie viele Nullen hat 10⁴ ausgeschrieben?
          options:
            - text: "5"
              correct: false
              info: 10⁵ hat fünf Nullen. Der Exponent ist 4.
            - text: "40"
              correct: false
              info: Das wäre 10 · 4. Der Exponent zählt die Nullen, er wird nicht mit 10 malgenommen.
            - text: "4"
              correct: true
              info: "10⁴ = 10 000: eine 1 mit vier Nullen."
            - text: "3"
              correct: false
              info: 10³ = 1000 hat drei Nullen. Der Exponent 4 zählt vier Nullen.
          right: Richtig.
          wrong: Nicht richtig.
        nojs:
          "Kurztest: Wie viele Nullen hat 10 hoch 4 ausgeschrieben? Zur Wahl stehen 4, 3, 5 und 40. Richtig ist 4, denn 10
          hoch 4 ist 10 000."
      - type: text
        text:
          "Wenn du hier unsicher warst: Wiederhole den Baustein „Potenzen und Zehnerpotenzen“ auf seiner Kartenseite: [Potenzen
          und Zehnerpotenzen](https://lernapps.net/apps/map/mathematik/c/potenzen/)."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: "- gleichartige Glieder zusammenfassen und gemeinsame Faktoren ausklammern kannst.

          - Potenzen mit natürlichen Exponenten berechnen und Zehnerpotenzen zum Schreiben großer Zahlen nutzen kannst.


          Hattest du bei jedem Kurztest alles richtig, beginnt die Reise: vom Proton bis zum Universum, mit Zehnerpotenzen. Sonst
          wiederhole zuerst den Baustein, bei dem du unsicher warst."
