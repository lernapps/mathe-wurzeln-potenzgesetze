# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Wissenschaftliche Schreibweise
description: Sehr große und sehr kleine Zahlen als Mantisse mal Zehnerpotenz schreiben, vergleichen und multiplizieren.
competencies:
  - potenzen-ganzzahlige-exponenten
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text:
          Auf der Reise vom Atom bis zum Universum stehen Zahlen mit vielen Nullen. Am Ende dieser Seite schreibst du sie
          kurz auf, vergleichst sie und rechnest mit ihnen.
      - type: single-choice
        id: groesser
        text: "Welche Länge ist größer: 3,2 · 10⁵ m oder 8,5 · 10⁴ m?"
        options:
          - text: 3,2 · 10⁵ m
            correct: true
            info: 3,2 · 10⁵ = 320 000. Das ist mehr als 85 000.
          - text: 8,5 · 10⁴ m
            correct: false
            info: 8,5 · 10⁴ = 85 000. Das ist weniger als 320 000.
          - text: Beide sind gleich groß.
            correct: false
            info: "Die Exponenten sind verschieden: 10⁵ ist zehnmal so groß wie 10⁴."
          - text: Das lässt sich nicht vergleichen.
            correct: false
            info: Du kannst beide Zahlen ausschreiben und vergleichen.
        explanation: Der größere Exponent entscheidet, wenn die Zahl vor dem Malpunkt zwischen 1 und 10 liegt.
  - type: section
    id: idee
    title: Zahl vor der Zehnerpotenz
    blocks:
      - type: text
        text:
          'Die **wissenschaftliche Schreibweise** schreibt jede positive Zahl als $m \cdot 10^n$ mit $1 \le m < 10$ und ganzem
          $n$. Du verschiebst dazu das Komma:'
      - type: formula
        formula: 45\,000 = 4{,}5 \cdot 10^4
      - type: text
        text: Das Komma wandert 4 Stellen nach links, der Exponent ist 4.
      - type: formula
        formula: 0{,}00072 = 7{,}2 \cdot 10^{-4}
      - type: text
        text: Das Komma wandert 4 Stellen nach rechts, der Exponent ist −4.
      - type: text
        text: Nach links verschoben wird der Exponent positiv, nach rechts negativ.
  - type: section
    id: regel
    title: Rechnen und Ordnen
    blocks:
      - type: definition
        term: wissenschaftliche Schreibweise
        explanation:
          Die wissenschaftliche Schreibweise schreibt eine positive Zahl als Mantisse mal Zehnerpotenz, zum Beispiel
          $4{,}5 \cdot 10^4$ für 45 000.
      - type: definition
        term: Mantisse
        explanation:
          Die Mantisse ist die Zahl $m$ vor der Zehnerpotenz in der wissenschaftlichen Schreibweise. Sie liegt mindestens
          bei 1 und unter 10.
      - type: formula
        formula: (a \cdot 10^m) \cdot (b \cdot 10^n) = (a \cdot b) \cdot 10^{m+n}
      - type: text
        text:
          Ist $a \cdot b$ mindestens 10, verschiebst du das Komma noch einmal und erhöhst den Exponenten um 1. Zum Umrechnen
          brauchst du 1 m = 1000 mm = $10^3$ mm. Die Tabelle zeigt die Größen der Reise, die du in den Aufgaben brauchst.
      - type: table
        caption: Die Größen der Reise
        header:
          - Größe
          - Länge
        rows:
          - - Proton
            - $1 \cdot 10^{-15}$ m
          - - Atom
            - $1 \cdot 10^{-10}$ m
          - - Virus
            - $1 \cdot 10^{-7}$ m
          - - Bakterium
            - $2 \cdot 10^{-6}$ m
          - - Haardicke
            - $1 \cdot 10^{-4}$ m
          - - Mensch
            - $1{,}7$ m
          - - Erde, Durchmesser
            - $1{,}3 \cdot 10^{7}$ m
          - - Sonne, Durchmesser
            - $1{,}4 \cdot 10^{9}$ m
          - - Erde bis Sonne
            - $1{,}5 \cdot 10^{11}$ m
          - - Lichtjahr
            - $9{,}5 \cdot 10^{15}$ m
          - - Milchstraße, Durchmesser
            - $1 \cdot 10^{21}$ m
          - - beobachtbares Universum, Durchmesser
            - $8{,}8 \cdot 10^{26}$ m
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: (4 · 10³) · (5 · 10⁶)
        blocks:
          - type: text
            text:
              'Erst die Mantissen und die Zehnerpotenzen getrennt: $4 \cdot 5 = 20$ und $10^3 \cdot 10^6 = 10^9$. Dann ist $20
              \cdot 10^9$ noch nicht in wissenschaftlicher Schreibweise:'
          - type: formula
            formula: 20 \cdot 10^9 = 2 \cdot 10^{10}
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: mm-exponent
        given:
          e:
            pick: 1
            from:
              data: groessen
        task:
          text:
            'Eine Länge ist ${{e.mantisse}} \cdot 10^{{{e.exponent}}}$ m groß (Größe: {{e.name}}). In Millimetern ist sie
            ${{e.mantisse}} \cdot 10^k$ mm. Wie groß ist k?'
        answer:
          value: e.exponent + 3
          compare:
            number:
              format: integer
        mistakes:
          - value: e.exponent - 3
            message: Millimeter sind kleiner als Meter. Dieselbe Länge hat in Millimetern eine größere Zahl.
          - value: e.exponent
            message: 1 m = 1000 mm = 10³ mm. Der Exponent ändert sich beim Umrechnen.
        hint: 1 m = 10³ mm. Die Zahl wird mit 10³ malgenommen.
        steps:
          - ${{e.mantisse}} \cdot 10^{{{e.exponent}}}$ m = ${{e.mantisse}} \cdot 10^{{{e.exponent}}} \cdot 10^3$ mm
          - Der Exponent ist {{e.exponent}} + 3 = {{answer}}.
      - type: generated
        id: produkt-wissenschaftlich
        given:
          a:
            int:
              - 2
              - 4
          b:
            int:
              - 2
              - 3
          m:
            int:
              - 2
              - 8
          n:
            int:
              - 2
              - 8
        where:
          - a * b < 10
          - m * n != m + n
          - m * n != m + n + 1
        task:
          text: $({{a}} \cdot 10^{{{m}}}) \cdot ({{b}} \cdot 10^{{{n}}}) = c \cdot 10^k$ mit $1 \le c < 10$. Wie groß ist k?
        answer:
          value: m + n
          compare:
            number:
              format: integer
        mistakes:
          - value: m * n
            message: Du hast die Exponenten multipliziert. Bei Zehnerpotenzen werden die Exponenten beim Malnehmen addiert.
          - value: m + n + 1
            message: Das Produkt {{a}} · {{b}} ist kleiner als 10. Du musst das Komma nicht noch einmal verschieben.
        hint: Rechne die Zahlen vor den Zehnerpotenzen und die Zehnerpotenzen getrennt.
        steps:
          - "{{a}} · {{b}} ist kleiner als 10."
          - k = {{m}} + {{n}} = {{answer}}
      - type: generated
        id: normieren
        given:
          a:
            oneOf:
              - 12
              - 15
              - 24
              - 36
              - 45
              - 63
              - 72
              - 84
          m:
            int:
              - 2
              - 6
        task:
          text: ${{a}} \cdot 10^{{{m}}} = c \cdot 10^k$ mit $1 \le c < 10$. Wie groß ist k?
        answer:
          value: m + 1
          compare:
            number:
              format: integer
        mistakes:
          - value: m
            message: Die Zahl {{a}} ist größer als 10. Du musst das Komma verschieben und den Exponenten erhöhen.
          - value: m - 1
            message: Das Komma geht nach links, dann wird der Exponent größer, nicht kleiner.
        hint: "{{a}} = c · 10, wobei c zwischen 1 und 10 liegt."
        steps:
          - ${{a}} \cdot 10^{{{m}}} = c \cdot 10 \cdot 10^{{{m}}}$
          - k = {{m}} + 1 = {{answer}}
      - type: ordering
        id: wissenschaftlich-ordnen
        text: Ordne die Zahlen von klein nach groß.
        items:
          - 9 · 10²
          - 4 · 10³
          - 1 · 10⁴
          - 2 · 10⁴
        explanation: 9 · 10² = 900; 4 · 10³ = 4000; 1 · 10⁴ = 10 000; 2 · 10⁴ = 20 000.
      - type: true-false
        id: nicht-normiert
        text: Die Zahl 45 · 10³ ist in wissenschaftlicher Schreibweise geschrieben.
        answer: false
        explanation: Die Zahl vor dem Malpunkt muss kleiner als 10 sein. Richtig wäre 4,5 · 10⁴.
      - type: number
        id: zehnerpotenzen-reise
        text:
          "Wie viele Zehnerpotenzen liegen ungefähr zwischen einem Atom ($10^{-10}$ m) und der Erde ($10^7$ m)? Gib k mit
          $10^7 : 10^{-10} = 10^k$ an."
        answer: 17
        tolerance: 0
        mistakes:
          - answer: -3
            message: Du hast 7 + (−10) gerechnet. Beim Teilen subtrahierst du den Exponenten des Nenners, also 7 − (−10).
        hint: Beim Teilen wird subtrahiert, auch bei negativen Exponenten.
        explanation: "10⁷ : 10⁻¹⁰ = 10 hoch (7 − (−10)) = 10¹⁷. Das sind 17 Zehnerpotenzen."
      - type: text
        text:
          "Du hast die Zehnerpotenz-Reise geschafft: vom Proton bei $10^{-15}$ m bis zum Universum bei $10^{26}$ m, mehr als
          vierzig Zehnerpotenzen. Dein Werkzeug dafür waren die Potenzgesetze und die negativen Exponenten. Als Nächstes brauchst
          du Wurzeln mit beliebigem Wurzelexponenten."
